# Lobby Configuration
# All NPC, hologram, and navigator settings are defined here.

# The origin point used as reference for offset calculation
origin:
  x: 0
  y: 100
  z: 0

# The spawn location (offset is calculated as spawn - origin)
spawn:
  world: "world"
  x: -68
  y: 6
  z: 50

# ============================================================
# NPC Definitions
# Each NPC has a skin (textures + signature), location, yaw,
# and a click action.
#
# Click action types:
#   "server"    -> sends player to the given server
#   "inventory" -> opens the GameSelect (reduce map) inventory
#
# Hologram fields (optional, creates a 2-line nametag above NPC):
#   hologram-name         -> Display name shown above the NPC
#   hologram-server       -> Server name used for live player count
#   hologram-maintenance  -> If true, shows "Maintenance" instead of count
#   hologram-name-offset  -> Y offset for the name line (default: 1.85)
#   hologram-count-offset -> Y offset for the count line (default: 2.15)
# ============================================================
npcs:
  - id: "mlgrush"
    skin-textures: ""
    skin-signature: ""
    body-yaw: 180
    location:
      x: -1.5
      y: 99
      z: 24.5
      yaw: 180
      pitch: 0
    click-action: "server"
    click-target: "mlgrush"
    hologram-name: "§bMLGRush"
    hologram-server: "mlgrush"

  - id: "reduce"
    skin-textures: ""
    skin-signature: ""
    body-yaw: 178
    location:
      x: 8.5
      y: 99
      z: 22.5
      yaw: 180
      pitch: 0
    click-action: "inventory"
    click-target: "GameSelect"
    hologram-name: "§bReduce"
    hologram-server: "reduce"

  - id: "knockbackffa"
    skin-textures: ""
    skin-signature: ""
