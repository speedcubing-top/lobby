    hologram-name: "§bKnockBackFFA"
    hologram-server: "knockbackffa"

  - id: "clutch"
    skin-textures: ""
    skin-signature: ""
    body-yaw: 180
    location:
      x: -4.5
      y: 99
      z: 23.5
      yaw: 180
      pitch: 0
    click-action: "server"
    click-target: "clutch"
    hologram-name: "§bClutch"
    hologram-server: "clutch"

  - id: "fastbuilder"
    skin-textures: ""
    skin-signature: ""
    body-yaw: 180
    location:
      x: 2.5
      y: 99
      z: 24.5
      yaw: 180
      pitch: 0
    click-action: "server"
    click-target: "fastbuilder"
    hologram-name: "§bFastBuilder"
    hologram-server: "fastbuilder"

  - id: "practice"
    skin-textures: ""
    skin-signature: ""
    body-yaw: 180
    location:
      x: 5.5
      y: 99
      z: 23.5
      yaw: 180
      pitch: 0
    click-action: "server"
    click-target: "practice"
    hologram-name: "§bPractice"
    hologram-server: "practice"
