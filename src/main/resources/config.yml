# ============================================================
# Hub Navigator (compass menu)
# Each entry defines one slot in the navigator inventory.
#
# Click action types:
#   "server"   -> sends the player to that server
#   "teleport" -> teleports the player to the given location
# ============================================================
navigator:
  title: "%lang_lobby_item_navigator%"
  size: 45
  items:
    - slot: 10
      material: "STICK"
      name: "%lang_lobby_item_mlgrush%"
      click-action: "server"
      click-target: "mlgrush"

    - slot: 16
      material: "WOOD_SWORD"
      name: "%lang_lobby_item_knockbackffa%"
      glow: true
      hide-attributes: true
      click-action: "server"
      click-target: "knockbackffa"

    - slot: 21
      material: "BLAZE_ROD"
      name: "%lang_lobby_item_reduce%"
      glow: true
      click-action: "teleport"
      teleport-world: "world"
      teleport-x: -60.5
      teleport-y: 5
      teleport-z: 70.5
      teleport-yaw: -39
      teleport-pitch: 9
      sound-world: "world"
      sound-x: 0.5
      sound-y: 99.01563
      sound-z: -15.5
      sound-name: "ENDERMAN_TELEPORT"

    - slot: 23
      material: "SANDSTONE"
      name: "%lang_lobby_item_fastbuilder%"
      glow: true
      click-action: "server"
      click-target: "fastbuilder"

    - slot: 28
      material: "DIAMOND_SWORD"
      name: "%lang_lobby_item_practice%"
      glow: true
      hide-attributes: true
      click-action: "server"
      click-target: "practice"

    - slot: 34
      material: "SANDSTONE_STAIRS"
      name: "%lang_lobby_item_clutch%"
      click-action: "server"
      click-target: "clutch"
